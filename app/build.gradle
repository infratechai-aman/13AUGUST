plugins {
    id 'com.android.application'
}

android {
    namespace 'com.squadlegends.brawler3d'
    compileSdk 34

    defaultConfig {
        applicationId "com.squadlegends.brawler3d"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
